<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qallow Control • Neon</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Matrix rain background -->
  <canvas id="matrix" class="matrix-bg" aria-hidden="true"></canvas>

  <main class="container">
    <header class="header">
      <h1>Qallow Simple Control Panel</h1>
      <div class="controls-right">
        <label class="toggle">
          <input type="checkbox" id="toggleMatrix" checked />
          <span>Matrix mode</span>
        </label>
      </div>
    </header>

    <section class="row">
      <button id="btnHealth" class="btn">Health</button>
      <button id="btnStart" class="btn btn-primary">Start VM</button>
      <button id="btnStop" class="btn btn-danger">Stop VM</button>
      <button id="btnMetrics" class="btn">Metrics</button>
      <button id="btnLogs" class="btn">Logs</button>
    </section>
    <section class="row">
      <button id="btnGrover" class="btn">Run Grover</button>
      <button id="btnBell" class="btn">Run Bell</button>
      <button id="btnDeutsch" class="btn">Run Deutsch</button>
      <button id="btnAll" class="btn">Run All</button>
    </section>

    <section class="panel">
      <div class="panel-title">Status <small id="statusTs">n/a</small></div>
      <pre id="statusOut" class="code">(none)</pre>
    </section>
    <section class="panel">
      <div class="panel-title">Terminal</div>
      <pre id="terminalOut" class="code">(none)</pre>
    </section>
    <section class="panel">
      <div class="panel-title">Audit Log</div>
      <pre id="auditOut" class="code">(none)</pre>
    </section>
  </main>

  <script src="/matrix.js"></script>
  <script src="/app.js"></script>
</body>
</html>
