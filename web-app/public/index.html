<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0e27" />
    <meta
      name="description"
      content="Qallow Unified Quantum-AGI System - Web Application"
    />
    <title>Qallow - Unified Quantum-AGI System</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
        overflow: hidden;
      }

      /* Matrix background effect */
      #matrix-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.15;
        pointer-events: none;
      }

      #root {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Matrix rain background effect -->
    <canvas id="matrix-bg" aria-hidden="true"></canvas>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Matrix background animation script -->
    <script>
      function initMatrixBackground() {
        const canvas = document.getElementById('matrix-bg');
        if (!canvas) {
          console.warn('Matrix canvas not found');
          return;
        }

        const ctx = canvas.getContext('2d');
        if (!ctx) {
          console.warn('Could not get canvas context');
          return;
        }

        let w, h, columns, drops, running = true;
        const glyphs = '01あいうえおカキクケコｱｲｳｴｵ01ΛλξπΣσµΩ<>[]{}/*+-=|';
        const fontSize = 14;
        const opacityTrail = 0.08;

        function resize() {
          const dpr = window.devicePixelRatio || 1;
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          columns = Math.ceil(w / fontSize);
          drops = Array.from({ length: columns }, () => Math.random() * -20);
          ctx.font = `${fontSize}px ui-monospace, monospace`;
        }

        function draw() {
          if (!running) return;
          ctx.fillStyle = `rgba(0, 0, 0, ${opacityTrail})`;
          ctx.fillRect(0, 0, w, h);

          for (let i = 0; i < columns; i++) {
            const char = glyphs[Math.floor(Math.random() * glyphs.length)];
            const x = i * fontSize;
            const y = drops[i] * fontSize;
            const hue = 188 + (i % 20);
            ctx.fillStyle = `hsl(${hue} 100% 60%)`;
            ctx.fillText(char, x, y);

            if (y > h && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
          }
          requestAnimationFrame(draw);
        }

        resize();
        window.addEventListener('resize', resize);
        document.addEventListener('visibilitychange', () => {
          running = document.visibilityState === 'visible';
          if (running) requestAnimationFrame(draw);
        });

        requestAnimationFrame(draw);
      }

      // Initialize when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initMatrixBackground);
      } else {
        initMatrixBackground();
      }
    </script>
  </body>
</html>
