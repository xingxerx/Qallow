name: Biome Coherence

on: [push, pull_request]

jobs:
  biome:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Qallow
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm ci

      - name: Run Biome check
        run: npm run biome:check

      - name: Export Biome diagnostics as JSON
        run: npm run biome:check:json

      - name: Upload Biome diagnostics artifact
        uses: actions/upload-artifact@v4
        with:
          name: biome-logs
          path: data/logs/biome_diagnostics.jsonl

